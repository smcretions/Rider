name: ovorideuser
description: OvoRide is a complete ride-sharing solution.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.1.1
  coupon_uikit: ^0.3.0
  cupertino_icons: ^1.0.9
  custom_marker_builder: ^1.0.2
  dio: ^5.9.2
  dotted_border: ^3.1.0
  file_picker: ^11.0.2
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^21.0.0
  flutter_rating_bar: ^4.0.1
  flutter_secure_storage: ^10.2.0
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.3.0
  flutter_widget_from_html: ^0.17.2
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get: ^4.7.3
  google_maps_flutter: ^2.17.0
  google_maps_flutter_android: 2.19.8
  google_sign_in: ^7.2.0
  image_picker: ^1.2.2
  in_app_review: ^2.0.11
  intl: ^0.20.2
  just_audio: 0.10.5
  line_icons: ^2.0.3
  logger: ^2.7.0
  lottie: ^3.3.3
  open_file: ^3.5.11
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pinput: ^6.0.2
  pusher_channels_flutter: ^2.6.0
  share_plus: 12.0.2
  shared_preferences: ^2.5.5
  sheet: ^1.0.0
  shimmer: ^3.0.0
  sign_in_with_apple: ^8.0.0
  timelines_plus: ^2.0.0
  timezone: ^0.11.0
  toastification: ^3.2.0
  url_launcher: ^6.3.2
  vibration: ^3.1.8
  zoom_tap_animation: ^1.1.0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  intl: any
  file_picker: any
  just_audio: any

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/social/
    - assets/images/logo/
    - assets/images/map/
    - assets/images/onboard/
    - assets/icon/
    - assets/icon/files/
    - assets/animation/
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
        - asset: assets/fonts/Satoshi-BlackItalic.otf
          weight: 900
          style: italic
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-LightItalic.otf
          weight: 300
          style: italic
